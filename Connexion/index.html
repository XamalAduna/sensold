
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
html{overflow-x:hidden;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;max-width:100%;}
body{background:#f5f5f5;color:#1a1a2e;overflow-x:hidden;}

/* --- EN-TÊTE FIXE --- */
header{
  background: #1a4d8f;
  color: white;
  padding: 18px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(0,0,0,.15);
  border-bottom: 3px solid #f5a623;
}
.logo{
  font-size:30px;
  font-weight:700;
  color: #fff;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:10px;
}
.logo .material-symbols-outlined{font-size:32px; color: #f5a623;}
nav a{color:#fff; text-decoration:none;margin-left:25px;}
.cart-icon{
  position:relative;
  cursor:pointer;
  color:#fff;
  font-size:24px;
  margin-left:25px;
  background:rgba(255,255,255,0.15);
  border:none;
  padding:10px 14px;
  border-radius:50px;
  transition:.25s;
  display:flex;
  align-items:center;
  gap:8px;
}
.cart-icon:hover{background:rgba(255,255,255,0.3); transform:translateY(-2px);}
.cart-icon .material-symbols-outlined{font-size:24px;}
.cart-badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#f5a623;
  color:#1a1a2e;
  border-radius:50%;
  width:20px;
  height:20px;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* Ajout d'un padding-top pour compenser la barre fixe */
#page-shop, #page-cart, #page-checkout {
  padding-top: 90px;
}

footer{
  background: #1a4d8f;
  color: white;
  text-align:center;
  padding:30px;
  margin-top:80px;
  border-top: 3px solid #f5a623;
}

/* --- BOUTONS PRINCIPAUX --- */
.btn{
  background: linear-gradient(135deg, #f5a623, #e69500);
  padding:16px 40px;
  color:white;
  text-decoration:none;
  border-radius:50px;
  font-weight:bold;
  transition:.3s;
  cursor:pointer;
  border:none;
  font-size:16px;
  box-shadow:0 8px 22px rgba(245,166,35,.35);
}
.btn:hover{
  background: linear-gradient(135deg, #e69500, #cc7a00);
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(245,166,35,.45);
}
.btn-secondary{
  padding:14px 30px;
  border:2px solid #1a4d8f;
  background:white;
  color:#1a4d8f;
  border-radius:50px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  font-family:Poppins,sans-serif;
  transition:.3s;
}
.btn-secondary:hover{
  background:#1a4d8f;
  color:white;
  transform:translateY(-2px);
}
.btn-detail{
  flex:1;
  padding:12px;
  border:2px solid #1a4d8f;
  background:white;
  color:#1a4d8f;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
  font-family:Poppins,sans-serif;
  font-weight:600;
}
.btn-detail:hover{
  background:#1a4d8f;
  color:white;
}
.btn-cart{
  flex:1;
  padding:12px;
  border:none;
  background: linear-gradient(135deg, #f5a623, #e69500);
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
  font-family:Poppins,sans-serif;
  font-weight:600;
}
.btn-cart:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(245,166,35,.4);
}

/* --- CARTES PRODUITS AVEC CONTOUR PERMANENT --- */
.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  transition:.4s;
  border: 2px solid #d0d0d0; /* Contour permanent */
}
.card:hover{
  transform:translateY(-10px);
  box-shadow:0 20px 50px rgba(0,0,0,.14);
  /* Le contour ne change pas au survol */
}

.card-carousel{
  position:relative;
  width:100%;
  height:220px;
  overflow:hidden;
  background:#eee;
}
.card-carousel-track{
  display:flex;
  height:100%;
  transition:transform .35s ease;
}
.card-carousel-track img{
  min-width:100%;
  height:100%;
  object-fit: contain;
  flex-shrink:0;
  background:#fff;
  padding:8px;
}

.content{
  padding:22px;
}
.content h3{
  margin-bottom:10px;
  font-weight:600;
  color:#1a1a2e;
  font-size: clamp(16px, 2.5vw, 22px);
}
.price{
  font-size: clamp(20px, 3vw, 28px);
  font-weight:bold;
  color:#f5a623;
  margin:15px 0;
}
.card-buttons{
  display:flex;
  gap:10px;
}
.card-buttons button{
  font-size: clamp(12px, 1.2vw, 14px);
  padding: 12px 8px;
  white-space: nowrap;
}

@media(max-width:600px){
  .card-buttons button{
    padding: 10px 6px;
    font-size: 12px;
  }
  .card-carousel{
    height:180px;
  }
  .content{
    padding:16px;
  }
}
@media(max-width:400px){
  .card-carousel{
    height:150px;
  }
}

/* --- MODAL --- */
.carousel{
  position:relative;
  width:100%;
  height:380px;
  overflow:hidden;
  border-radius:20px 20px 0 0;
  background:#eee;
}
.carousel-track{
  display:flex;
  height:100%;
  transition:transform .4s ease;
}
.carousel-track img{
  min-width:100%;
  height:100%;
  object-fit: contain;
  flex-shrink:0;
  background:#fff;
  padding:12px;
}

/* --- RESTE DU STYLE --- */
.container{width:90%;max-width:1200px;margin:60px auto;}
.title{text-align:center;font-size:42px;font-weight:700;margin-bottom:50px;position:relative;color:#1a1a2e;}
.title::after{content:'';display:block;width:70px;height:4px;background:linear-gradient(90deg,#f5a623,#e69500);border-radius:4px;margin:14px auto 0;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:white;border-radius:20px;max-width:800px;width:90%;max-height:90vh;overflow-y:auto;position:relative;padding:0;}
.modal-close{position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer;color:#666;z-index:10;background:none;border:none;font-family:Poppins,sans-serif;}
.modal-close:hover{color:#f5a623;}
.modal-body{padding:30px;}
.modal-body h2{font-size:28px;margin-bottom:10px;color:#1a1a2e;}
.modal-price{font-size:32px;font-weight:bold;color:#f5a623;margin-bottom:20px;}
.modal-desc{color:#666;line-height:1.8;margin-bottom:20px;}
.modal-details{background:#f7f7f7;border-radius:10px;padding:20px;margin-bottom:25px;}
.modal-details h4{font-size:16px;margin-bottom:12px;color:#333;}
.modal-details ul{list-style:none;padding:0;}
.modal-details ul li{padding:6px 0;border-bottom:1px solid #eee;font-size:14px;color:#555;}
.modal-details ul li:last-child{border-bottom:none;}
.modal-details ul li span{font-weight:600;color:#1a1a2e;margin-right:8px;}
.modal-btn-cart{width:100%;padding:16px;border:none;background:linear-gradient(135deg,#f5a623,#e69500);color:white;border-radius:12px;cursor:pointer;font-size:18px;font-weight:600;transition:.3s;font-family:Poppins,sans-serif;}
.modal-btn-cart:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,166,35,.4);}
#page-shop,#page-cart,#page-checkout{display:block;}
#page-cart,#page-checkout{display:none;}
.page-title{font-size:36px;text-align:center;margin-bottom:40px;color:#1a1a2e;}
.cart-empty{text-align:center;padding:60px;color:#999;font-size:18px;}
.cart-items{display:flex;flex-direction:column;gap:20px;margin-bottom:40px;}
.cart-item{background:white;border-radius:15px;padding:20px;display:flex;align-items:center;gap:20px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
.cart-item-img{width:80px;height:80px;object-fit:contain;background:#fff;border-radius:10px;padding:5px;}
.cart-item-img-placeholder{width:80px;height:80px;background:#eee;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cart-item-info{flex:1;}
.cart-item-info h4{font-size:16px;margin-bottom:5px;color:#1a1a2e;}
.cart-item-info .item-price{color:#f5a623;font-weight:bold;font-size:18px;}
.cart-item-qty{display:flex;align-items:center;gap:10px;}
.qty-btn{width:30px;height:30px;border:1px solid #ddd;background:white;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{background:#f5a623;color:white;border-color:#f5a623;}
.cart-item-total{font-weight:700;font-size:18px;min-width:70px;text-align:right;color:#1a1a2e;}
.remove-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:20px;padding:5px;}
.remove-btn:hover{color:#f5a623;}
.cart-summary{background:white;border-radius:15px;padding:30px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
.cart-summary h3{font-size:22px;margin-bottom:20px;color:#1a1a2e;}
.summary-line{display:flex;justify-content:space-between;margin-bottom:12px;font-size:15px;}
.summary-line.total{font-size:20px;font-weight:700;border-top:2px solid #eee;padding-top:15px;margin-top:10px;color:#1a1a2e;}
.cart-actions{display:flex;gap:15px;margin-top:25px;flex-wrap:wrap;}
.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
@media(max-width:700px){.checkout-grid{grid-template-columns:1fr;}}
.checkout-form{background:white;border-radius:15px;padding:30px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
.checkout-form h3{font-size:20px;margin-bottom:25px;color:#1a1a2e;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:600;color:#555;}
.form-group input,.form-group select{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:10px;font-size:15px;font-family:Poppins,sans-serif;outline:none;transition:.2s;background:white;}
.form-group input:focus,.form-group select:focus{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.2);}
.form-group input.error{border-color:#e94560;background:#fff5f5;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.order-recap{background:white;border-radius:15px;padding:30px;box-shadow:0 4px 15px rgba(0,0,0,.08);height:fit-content;}
.order-recap h3{font-size:20px;margin-bottom:20px;color:#1a1a2e;}
.recap-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;}
.recap-item:last-child{border-bottom:none;}
.confirm-btn{width:100%;margin-top:20px;}
.success-screen{text-align:center;padding:80px 30px;}
.success-screen .check{font-size:80px;margin-bottom:20px;}
.success-screen h2{font-size:32px;margin-bottom:15px;color:#27ae60;}
.success-screen p{color:#666;margin-bottom:30px;font-size:16px;}
.input-icon-wrapper{position:relative;display:flex;align-items:center;border:1px solid #ddd;border-radius:10px;padding:0 15px;transition:.2s;background:white;}
.input-icon-wrapper:focus-within{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.2);}
.input-icon-wrapper .material-symbols-outlined{color:#f5a623;font-size:22px;margin-right:12px;flex-shrink:0;}
.input-icon-wrapper input,.input-icon-wrapper select{width:100%;border:none;outline:none;padding:12px 0;font-size:15px;font-family:Poppins,sans-serif;background:transparent;}
.input-icon-wrapper select{cursor:pointer;}
.input-icon-wrapper input:disabled{background:transparent;cursor:not-allowed;}
.error-message{color:#e94560;font-size:12px;margin-top:4px;display:none;}
.card-carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:white;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:.2s;}
.card-carousel-btn:hover{background:rgba(245,166,35,.85);}
.card-carousel-btn.prev{left:8px;}
.card-carousel-btn.next{right:8px;}
.card-carousel-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;}
.card-carousel-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;padding:0;transition:.2s;}
.card-carousel-dot.active{background:white;}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:white;border:none;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:.2s;}
.carousel-btn:hover{background:rgba(245,166,35,.85);}
.carousel-btn.prev{left:12px;}
.carousel-btn.next{right:12px;}
.carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;}
.carousel-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;transition:.2s;padding:0;}
.carousel-dot.active{background:white;}

@media(max-width:600px){
  header{padding:15px 5%;}
  .logo{font-size:22px;}
  .logo .material-symbols-outlined{font-size:26px;}
  .container{width:92%;margin:35px auto;}
  .title{font-size:28px;margin-bottom:25px;}
  .page-title{font-size:26px;margin-bottom:25px;}
  .products{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
  .modal{width:95%;max-height:95vh;}
  .carousel{height:220px;}
  .modal-body{padding:20px;}
  .modal-body h2{font-size:22px;}
  .modal-price{font-size:24px;}
  .form-row{grid-template-columns:1fr;gap:0;}
  .cart-item{flex-wrap:wrap;padding:15px;gap:12px;}
  .cart-item-info{min-width:120px;}
  .cart-item-total{text-align:left;}
  .checkout-form,.order-recap{padding:20px;}
  .cart-summary{padding:20px;}
  .cart-actions{flex-direction:column;}
  .cart-actions button{width:100%;}
  .input-icon-wrapper{padding:0 12px;}
  .input-icon-wrapper .material-symbols-outlined{font-size:20px;}
  #page-shop, #page-cart, #page-checkout {
    padding-top: 80px;
  }
}
@media(min-width:601px) and (max-width:768px){
  .products{grid-template-columns:repeat(2,1fr);gap:20px;}
  .container{width:95%;}
}
@media(max-width:500px){
  .products{grid-template-columns:1fr;gap:15px;}
  .container{width:95%;margin:25px auto;}
}

/* Ajout pour l'affichage du +221 dans les champs téléphone */
.phone-prefix {
  color: #555;
  font-weight: 600;
  font-size: 15px;
  padding-right: 4px;
  flex-shrink: 0;
}
</style>
</head>

<header>
  <div class="logo" onclick="showPage('shop')" style="cursor:pointer">
    <span class="material-symbols-outlined">shopping_bag</span>ShopX
  </div>
  <nav>
    <button class="cart-icon" onclick="showPage('cart')" title="Panier">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
  </nav>
</header>

<!-- PAGE BOUTIQUE (sans la section hero) -->
<div id="page-shop">
  <div class="container">
    <h2 class="title">Nos Produits</h2>
    <div class="products" id="products-grid"></div>
  </div>
</div>

<!-- PAGE PANIER -->
<div id="page-cart">
  <div class="container">
    <h2 class="page-title"><span class="material-symbols-outlined" style="font-size:32px;vertical-align:middle;">shopping_cart</span> Mon Panier</h2>
    <div id="cart-content"></div>
  </div>
</div>

<!-- PAGE COMMANDE -->
<div id="page-checkout">
  <div class="container">
    <h2 class="page-title"><span class="material-symbols-outlined" style="font-size:32px;vertical-align:middle;">assignment</span> Finaliser la commande</h2>
    <div id="checkout-content"></div>
  </div>
</div>

<!-- MODAL DÉTAIL PRODUIT -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modal-inner"></div>
  </div>
</div>

<footer>
  <p>© 2026 ShopX - Tous droits réservés.</p>
</footer>

// ── FONCTION DE FORMATAGE DES PRIX EN FCFA AVEC ESPACES ──
function formatPrice(price) {
  return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";
}

// ── ÉTAT PANIER ──
let cart = [];
const cardSlides = {};

function getCartCount(){return cart.reduce((s,i)=>s+i.qty,0);}
function getCartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function updateBadge(){document.getElementById('cart-badge').textContent=getCartCount();}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  const existing=cart.find(x=>x.id===id);
  if(existing) existing.qty++;
  else cart.push({...p, qty:1});
  updateBadge();
  const b=document.getElementById('cart-badge');
  b.style.transform='scale(1.5)';b.style.background='#f5a623';
  setTimeout(()=>{b.style.transform='scale(1)';b.style.background='#f5a623';},300);
}

// ── CAROUSEL CARTE ──
function slideCard(productId, dir, event){
  event.stopPropagation();
  const p = products.find(x=>x.id===productId);
  const total = p.gallery.length;
  cardSlides[productId] = ((cardSlides[productId]||0) + dir + total) % total;
  updateCardCarousel(productId);
}
function goToCardSlide(productId, i, event){
  event.stopPropagation();
  cardSlides[productId] = i;
  updateCardCarousel(productId);
}
function updateCardCarousel(productId){
  const slide = cardSlides[productId] || 0;
  const track = document.getElementById('card-track-'+productId);
  if(track) track.style.transform = `translateX(-${slide*100}%)`;
  document.querySelectorAll('#card-dots-'+productId+' .card-carousel-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===slide);
  });
}

// ── CAROUSEL MODAL ──
let currentSlide = 0;
let currentGallery = [];

function buildCarousel(gallery) {
  currentGallery = gallery;
  currentSlide = 0;
  const slides = gallery.map(src=>`<img src="${src}" alt="">`).join('');
  const dots = gallery.map((_,i)=>`<button class="carousel-dot${i===0?' active':''}" onclick="goToSlide(${i})"></button>`).join('');
  return `
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carousel-track">${slides}</div>
      <button class="carousel-btn prev" onclick="slideCarousel(-1)">&#8592;</button>
      <button class="carousel-btn next" onclick="slideCarousel(1)">&#8594;</button>
      <div class="carousel-dots">${dots}</div>
    </div>
  `;
}
function slideCarousel(dir){
  currentSlide=(currentSlide+dir+currentGallery.length)%currentGallery.length;
  updateCarousel();
}
function goToSlide(i){
  currentSlide=i;
  updateCarousel();
}
function updateCarousel(){
  document.getElementById('carousel-track').style.transform=`translateX(-${currentSlide*100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d,i)=>d.classList.toggle('active',i===currentSlide));
}

// ── MODAL ──
function openModal(id){
  const p=products.find(x=>x.id===id);
  document.getElementById('modal-inner').innerHTML=`
    ${buildCarousel(p.gallery)}
    <div class="modal-body">
      <h2>${p.name}</h2>
      <div class="modal-price">${formatPrice(p.price)}</div>
      <p class="modal-desc">${p.desc}</p>
      <div class="modal-details">
        <h4>📋 Caractéristiques</h4>
        <ul>${p.details.map(d=>`<li><span>${d.label} :</span>${d.val}</li>`).join('')}</ul>
      </div>
      <button class="modal-btn-cart" onclick="addToCart(${p.id});this.textContent='✓ Ajouté au panier';this.style.background='#27ae60'">🛒 Ajouter au panier</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){
  document.getElementById('modal-overlay').classList.remove('active');
  document.body.style.overflow='';
}

// ── NAVIGATION PAGES ──
function showPage(page){
  document.getElementById('page-shop').style.display='none';
  document.getElementById('page-cart').style.display='none';
  document.getElementById('page-checkout').style.display='none';
  if(page==='shop') document.getElementById('page-shop').style.display='block';
  else if(page==='cart'){document.getElementById('page-cart').style.display='block';renderCart();}
  else if(page==='checkout'){document.getElementById('page-checkout').style.display='block';renderCheckout();}
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderCart(){
  const el=document.getElementById('cart-content');
  if(cart.length===0){
    el.innerHTML=`<div class="cart-empty"><span class="material-symbols-outlined" style="font-size:60px;display:block;margin-bottom:15px;">shopping_cart</span>Votre panier est vide.<br><br><button class="btn" onclick="showPage('shop')">Continuer les achats</button></div>`;
    return;
  }
  const items=cart.map((item)=>`
    <div class="cart-item">
      <img class="cart-item-img" src="${item.img}" alt="${item.name}">
      <div class="cart-item-info">
        <h4>${item.name}</h4>
        <div class="item-price">${formatPrice(item.price)}</div>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
        <span>${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
      </div>
      <div class="cart-item-total">${formatPrice(item.price * item.qty)}</div>
      <button class="remove-btn" onclick="removeFromCart(${item.id})">🗑</button>
    </div>
  `).join('');
  const total=getCartTotal();
  el.innerHTML=`
    <div class="cart-items">${items}</div>
    <div class="cart-summary">
      <h3>Récapitulatif</h3>
      <div class="summary-line"><span>Sous-total</span><span>${formatPrice(total)}</span></div>
      <div class="summary-line"><span>Livraison</span><span>Gratuite</span></div>
      <div class="summary-line total"><span>Total</span><span>${formatPrice(total)}</span></div>
      <div class="cart-actions">
        <button class="btn-secondary" onclick="showPage('shop')">← Continuer</button>
        <button class="btn" onclick="showPage('checkout')">Commander →</button>
      </div>
    </div>
  `;
}
function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0) cart=cart.filter(x=>x.id!==id);
  updateBadge();renderCart();
}
function removeFromCart(id){
  cart=cart.filter(x=>x.id!==id);
  updateBadge();renderCart();
}

// ── FORMATAGE TÉLÉPHONE AVEC +221 FIXE ──
function formatPhone(input) {
  let value = input.value.replace(/\D/g, '');
  if (value.length > 9) value = value.slice(0, 9);
  
  let formatted = '';
  if (value.length > 0) {
    formatted = value.slice(0, 2);
    if (value.length > 2) {
      formatted += ' ' + value.slice(2, 5);
    }
    if (value.length > 5) {
      formatted += ' ' + value.slice(5, 7);
    }
    if (value.length > 7) {
      formatted += ' ' + value.slice(7, 9);
    }
  }
  input.value = formatted;
}

// ── VALIDATION TÉLÉPHONE ──
function validatePhone(input) {
  const digits = input.value.replace(/\s/g, '');
  if (digits.length === 0) return true;
  return digits.length === 9 && /^\d{9}$/.test(digits);
}

              </select>
            </div>
            <div class="error-message" id="quartier-error">Veuillez sélectionner un quartier</div>
          </div>
          
          <div class="form-group">
            <label>Adresse complète <span style="color:#e94560;">*</span></label>
            <div class="input-icon-wrapper">
              <span class="material-symbols-outlined">location_on</span>
              <input type="text" id="adresse_complete" placeholder="Rue, numéro, repère..." required>
            </div>
            <div class="error-message" id="adresse_complete-error">Veuillez entrer votre adresse complète</div>
          </div>
        </div>
      </div>
      <div class="order-recap">
        <h3><span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">receipt_long</span> Votre commande</h3>
        ${recapItems}
        <div class="recap-item"><span>Livraison</span><span>Gratuite</span></div>
        <div class="recap-item" style="font-weight:700;font-size:16px;margin-top:10px;border-top:2px solid #eee;padding-top:15px"><span>Total</span><span>${formatPrice(total)}</span></div>
        <button class="btn confirm-btn" onclick="confirmOrder()">✅ Confirmer la commande</button>
        <button class="btn-secondary" style="width:100%;margin-top:10px;text-align:center" onclick="showPage('cart')">← Retour au panier</button>
      </div>
    </div>
  `;
  
  setupAddressSelects();
}

// ── GESTION DES SELECT ADRESSES ──
function setupAddressSelects() {
  const dept = document.getElementById('departement');
  const commune = document.getElementById('commune');
  const quartier = document.getElementById('quartier');
  
  dept.onchange = function() {
    commune.innerHTML = '<option value="">Sélectionner une commune</option>';
    quartier.innerHTML = '<option value="">Sélectionner un quartier</option>';
    commune.disabled = true;
    quartier.disabled = true;
    
    if (this.value && addressData[this.value]) {
      commune.disabled = false;
      const communes = addressData[this.value];
      for (let c in communes) {
        commune.innerHTML += `<option value="${c}">${c}</option>`;
      }
    }
  };
  
  commune.onchange = function() {
    quartier.innerHTML = '<option value="">Sélectionner un quartier</option>';
    quartier.disabled = true;
    
    if (this.value && dept.value && addressData[dept.value] && addressData[dept.value][this.value]) {
      quartier.disabled = false;
      const quartiers = addressData[dept.value][this.value];
      for (let q in quartiers) {
        quartier.innerHTML += `<option value="${q}">${q}</option>`;
      }
    }
  };
}

// ── CONFIRMATION COMMANDE AVEC FIREBASE ──
async function confirmOrder() {
  const prenom = document.getElementById('prenom');
  const nom = document.getElementById('nom');
  const telephone = document.getElementById('telephone');
  const telephone2 = document.getElementById('telephone2');
  const departement = document.getElementById('departement');
  const commune = document.getElementById('commune');
  const quartier = document.getElementById('quartier');
  const adresseComplete = document.getElementById('adresse_complete');
  
  let isValid = true;
  
  const requiredFields = [
    { el: prenom, error: 'prenom-error' },
    { el: nom, error: 'nom-error' },
    { el: telephone, error: 'telephone-error' },
    { el: departement, error: 'departement-error' },
    { el: commune, error: 'commune-error' },
    { el: quartier, error: 'quartier-error' },
    { el: adresseComplete, error: 'adresse_complete-error' }
  ];
  
  requiredFields.forEach(field => {
    const el = field.el;
    const errorEl = document.getElementById(field.error);
    if (!el.value || el.value === '') {
      el.classList.add('error');
      if (errorEl) errorEl.style.display = 'block';
      isValid = false;
    } else {
      el.classList.remove('error');
      if (errorEl) errorEl.style.display = 'none';
    }
  });
  
  // Vérification à 9 chiffres pour +221
  const phoneDigits = telephone.value.replace(/\s/g, '');
  if (phoneDigits.length !== 9 || !/^\d+$/.test(phoneDigits)) {
    telephone.classList.add('error');
    document.getElementById('telephone-error').style.display = 'block';
    isValid = false;
  }
  
  if (telephone2.value) {
    const phone2Digits = telephone2.value.replace(/\s/g, '');
    if (phone2Digits.length !== 9 || !/^\d+$/.test(phone2Digits)) {
      telephone2.classList.add('error');
      document.getElementById('telephone2-error').style.display = 'block';
      isValid = false;
    } else {
      telephone2.classList.remove('error');
      document.getElementById('telephone2-error').style.display = 'none';
    }
  }
  
  if (!isValid) {
    const firstError = document.querySelector('.error');
    if (firstError) firstError.focus();
    return;
  }
  
  const orderData = {
    prenom: prenom.value.trim(),
    nom: nom.value.trim(),
    telephone: telephone.value,
    telephone2: telephone2.value || '',
    departement: departement.value,
    commune: commune.value,
    quartier: quartier.value,
    adresseComplete: adresseComplete.value.trim(),
    produits: cart.map(item => ({
      id: item.id,
      nom: item.name,
      prix: item.price,
      quantite: item.qty,
      total: item.price * item.qty
    })),
    totalCommande: getCartTotal(),
    dateCommande: new Date().toISOString()
  };
  
  try {
    const { db, collection, addDoc } = window;
    const docRef = await addDoc(collection(db, "annonces"), orderData);
    console.log("Commande enregistrée avec ID:", docRef.id);
    
    cart = [];
    updateBadge();
    document.getElementById('checkout-content').innerHTML=`
      <div class="success-screen">
        <div class="check">✅</div>
        <h2>Commande confirmée !</h2>
        <p>Merci pour votre achat. Votre commande a été enregistrée.<br>Livraison estimée : <strong>3 à 5 jours ouvrés</strong>.</p>
        <button class="btn" onclick="showPage('shop')">Retour à la boutique</button>
      </div>
    `;
  } catch (error) {
    console.error("Erreur lors de l'enregistrement:", error);
    alert("Une erreur est survenue lors de l'enregistrement de votre commande. Veuillez réessayer.");
  }
}

renderProducts();

</script>
